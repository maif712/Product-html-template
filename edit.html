<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - ProdM</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form.css">
</head>
<body>

    <header>
        <nav class="container">
            <a href="index.html" class="logo">ProdM.</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="create.html">Add Product</a></li>
                <li><a href="search.html">Search</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="form-container panel">
            <h1 class="form-title">Edit Product</h1>
            <p class="form-subtitle">Update the details for 'Minimalist Desk Chair'.</p>

            <form action="#" method="POST" class="product-form">
                <div class="form-grid">
                    <!-- Column 1 -->
                    <div class="form-column">
                        <div class="form-group">
                            <label for="name">Product Name</label>
                            <input type="text" id="name" name="name" value="Minimalist Desk Chair" required>
                        </div>
                        <div class="form-group">
                            <label for="price">Price</label>
                            <input type="number" id="price" name="price" step="0.01" min="0" value="299.99" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <input type="text" id="category" name="category" value="Furniture" required>
                        </div>
                        <div class="form-group">
                            <label for="brand">Brand</label>
                            <input type="text" id="brand" name="brand" value="ComfySit">
                        </div>
                        <div class="form-group">
                            <label for="stock">Stock</label>
                            <input type="number" id="stock" name="stock" min="0" value="150" required>
                        </div>
                         <div class="form-group">
                            <label for="sku">SKU</label>
                            <input type="text" id="sku" name="sku" value="CS-MDC-BL-2024">
                        </div>
                    </div>
                    <!-- Column 2 -->
                    <div class="form-column">
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" name="description" rows="4">A sleek, ergonomic chair designed for modern workspaces.</textarea>
                        </div>
                        <div class="form-group">
                            <label for="tags">Tags (comma-separated)</label>
                            <input type="text" id="tags" name="tags" value="chair, furniture, office, minimalist">
                        </div>
                         <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" name="status">
                                <option value="active" selected>Active</option>
                                <option value="archived">Archived</option>
                                <option value="draft">Draft</option>
                            </select>
                        </div>
                        <div class="form-group-inline">
                            <input type="checkbox" id="featured" name="featured" checked>
                            <label for="featured">Featured Product</label>
                        </div>
                    </div>
                </div>

                <fieldset class="form-fieldset">
                    <legend>Additional Details</legend>
                    <div class="form-grid">
                        <div class="form-column">
                             <div class="form-group">
                                <label for="color">Color</label>
                                <input type="text" id="color" name="color" value="Black">
                            </div>
                             <div class="form-group">
                                <label for="size">Size</label>
                                <input type="text" id="size" name="size" value="Large">
                            </div>
                        </div>
                        <div class="form-column">
                             <div class="form-group">
                                <label for="material">Material</label>
                                <input type="text" id="material" name="material" value="Mesh, Aluminum">
                            </div>
                             <div class="form-group">
                                <label for="weight">Weight (kg)</label>
                                <input type="number" id="weight" name="weight" step="0.01" value="15.5">
                            </div>
                        </div>
                    </div>
                </fieldset>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 ProdM. All Rights Reserved.</p>
        </div>
    </footer>

    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">☀️</button>

    <div class="toast-container"></div>

    <script src="js/main.js"></script>
</body>
</html>
