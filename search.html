<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Products - ProdM</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/search.css">
</head>
<body>

    <header>
        <nav class="container">
            <a href="index.html" class="logo">ProdM.</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="create.html">Add Product</a></li>
            </ul>
            <form action="search.html" method="GET" class="nav-search-form">
                <input type="search" name="query" placeholder="Search..." class="nav-search-input">
                <button type="submit" aria-label="Search button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </form>
        </nav>
    </header>

    <main class="container">
        <section class="search-section">
            <h1 class="search-title">Search Products</h1>
            <form action="#" method="GET" class="search-form">
                <input type="search" name="query" placeholder="Search by name, category, SKU, etc..." class="search-input">
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
        </section>

        <section class="results-section">
            <h2 class="results-title">Search Results for "desk"</h2>
            <p class="results-count">Showing 2 results</p>

            <div class="results-list">
                <!-- Result 1 -->
                <div class="product-list-item panel">
                    <div class="product-info">
                        <h3 class="product-name"><a href="product.html">Minimalist Desk Chair</a></h3>
                        <p class="product-meta">
                            <span class="product-category">Furniture</span> |
                            <span class="product-sku">SKU: CS-MDC-BL-2024</span>
                        </p>
                    </div>
                    <div class="product-actions">
                        <span class="product-price">$299.99</span>
                        <a href="product.html" class="btn btn-secondary">View Details</a>
                    </div>
                </div>
                <!-- Result 2 -->
                <div class="product-list-item panel">
                    <div class="product-info">
                        <h3 class="product-name"><a href="product.html">Smart LED Desk Lamp</a></h3>
                        <p class="product-meta">
                            <span class="product-category">Lighting</span> |
                            <span class="product-sku">SKU: SLDL-WH-2024</span>
                        </p>
                    </div>
                    <div class="product-actions">
                        <span class="product-price">$89.50</span>
                        <a href="product.html" class="btn btn-secondary">View Details</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 ProdM. All Rights Reserved.</p>
        </div>
    </footer>

    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">☀️</button>

    <div class="toast-container"></div>

    <script src="js/main.js"></script>
</body>
</html>
