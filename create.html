        <main class="main-content">
            <div class="form-container panel">
                <h1 class="form-title">Create New Product</h1>
                <p class="form-subtitle">Fill out the details below to add a new product to the catalog.</p>

                <form action="#" method="POST" class="product-form">
                    <div class="form-grid">
                        <!-- Column 1 -->
                        <div class="form-column">
                            <div class="form-group">
                                <label for="name">Product Name</label>
                                <input type="text" id="name" name="name" required>
                            </div>
                            <div class="form-group">
                                <label for="price">Price</label>
                                <input type="number" id="price" name="price" step="0.01" min="0" required>
                            </div>
                            <div class="form-group">
                                <label for="category">Category</label>
                                <input type="text" id="category" name="category" required>
                            </div>
                            <div class="form-group">
                                <label for="brand">Brand</label>
                                <input type="text" id="brand" name="brand">
                            </div>
                            <div class="form-group">
                                <label for="stock">Stock</label>
                                <input type="number" id="stock" name="stock" min="0" required>
                            </div>
                             <div class="form-group">
                                <label for="sku">SKU</label>
                                <input type="text" id="sku" name="sku">
                            </div>
                        </div>
                        <!-- Column 2 -->
                        <div class="form-column">
                            <div class="form-group">
                                <label for="description">Description</label>
                                <textarea id="description" name="description" rows="4"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="tags">Tags (comma-separated)</label>
                                <input type="text" id="tags" name="tags">
                            </div>
                             <div class="form-group">
                                <label for="status">Status</label>
                                <select id="status" name="status">
                                    <option value="active">Active</option>
                                    <option value="archived">Archived</option>
                                    <option value="draft">Draft</option>
                                </select>
                            </div>
                            <div class="form-group-inline switch-group">
                                <div class="switch-container">
                                    <label class="switch">
                                        <input type="checkbox" id="featured" name="featured">
                                        <span class="slider"></span>
                                    </label>
                                    <label for="featured">Featured Product</label>
                                </div>
                                <div class="switch-container">
                                    <label class="switch">
                                        <input type="checkbox" id="in-slider" name="in-slider">
                                        <span class="slider"></span>
                                    </label>
                                    <label for="in-slider">Show in Slider</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <fieldset class="form-fieldset">
                        <legend>Additional Details</legend>
                        <div class="form-grid">
                            <div class="form-column">
                                 <div class="form-group">
                                    <label for="color">Color</label>
                                    <input type="text" id="color" name="color">
                                </div>
                                 <div class="form-group">
                                    <label for="size">Size</label>
                                    <input type="text" id="size" name="size">
                                </div>
                            </div>
                            <div class="form-column">
                                 <div class="form-group">
                                    <label for="material">Material</label>
                                    <input type="text" id="material" name="material">
                                </div>
                                 <div class="form-group">
                                    <label for="weight">Weight (kg)</label>
                                    <input type="number" id="weight" name="weight" step="0.01">
                                </div>
                            </div>
                        </div>
                    </fieldset>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-submit">
                            <span class="btn-text">Create Product</span>
                            <span class="btn-spinner"></span>
                            <span class="btn-success-icon">✔</span>
                        </button>
                        <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div class="toast-container"></div>
    <script src="js/main.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        // Interactive form submission script
        const form = document.querySelector('.product-form');
        const submitBtn = form.querySelector('.btn-submit');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (submitBtn.classList.contains('loading')) return;

            // --- Start loading state ---
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            // --- Simulate network request ---
            setTimeout(() => {
                // --- Switch to success state ---
                submitBtn.classList.remove('loading');
                submitBtn.classList.add('success');

                // --- Show toast and reset form ---
                showToast('Product created successfully!', 'success');
                form.reset();

                // --- Revert button to normal state ---
                setTimeout(() => {
                    submitBtn.classList.remove('success');
                    submitBtn.disabled = false;
                }, 2000);

            }, 1500);
        });
    </script>
